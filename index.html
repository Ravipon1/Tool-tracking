<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC Tool Tracker</title>
<style>
  body { font-family: 'IBM Plex Sans Thai', sans-serif; padding: 20px; background: #f4f8ff; }
  .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
  input, select, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 6px; }
  button { background: #2563eb; color: white; border: none; font-weight: bold; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 15px 25px; border-radius: 8px; z-index: 9999; }
</style>
</head>
<body>

<div class="card">
  <h2>🔧 ทดสอบการยืมเครื่องมือ</h2>
  <input type="text" id="name" placeholder="ชื่อผู้ยืม">
  <input type="text" id="asset" placeholder="Asset ID (เช่น BIC-T-001)">
  <select id="dept">
    <option value="">เลือกแผนก</option>
    <option value="ME">ME - Mechanical Engineer</option>
    <option value="EE">EE - Electrical Engineer</option>
    <option value="CI">CI - Control & Instrument Engineer</option>
  </select>
  <button onclick="testSubmit()">ยืนยันการยืม</button>
</div>

<div id="toast" class="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzC-nIsDH2e3VqUeiV2CFSkbeKRiNNan-nsuBcC8M8mtH92gnRZD_xLY1x5rwKOy52A/exec";

async function testSubmit() {
  const name = document.getElementById('name').value.trim();
  const asset = document.getElementById('asset').value.trim().toUpperCase();
  const dept = document.getElementById('dept').value;

  if (!name || !asset || !dept) {
    showToast("กรุณากรอกข้อมูลให้ครบ");
    return;
  }

  const record = {
    id: "TX" + Date.now(),
    borrowerName: name,
    department: dept,
    assetId: asset,
    toolName: "เครื่องมือ " + asset
  };

  showToast("กำลังส่งข้อมูล...");

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'borrow', record: record })
    });

    showToast("✅ ส่งข้อมูลสำเร็จ! ตรวจ Google Sheet ได้เลย", 5000);
    
    // รีเซ็ต
    document.getElementById('name').value = '';
    document.getElementById('asset').value = '';

  } catch (err) {
    console.error(err);
    showToast("❌ ส่งข้อมูลไม่สำเร็จ ดู Console (F12)", 5000);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 5000);
}
</script>
</body>
</html>
